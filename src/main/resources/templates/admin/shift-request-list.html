<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>シフト申請一覧</title>
    <style>
        .container { display: flex; position: relative; }
        .main-content { flex: 1; }
        .sidebar {
            width: 350px;
            border-left: 1px solid #ccc;
            padding: 15px;
            position: absolute;
            right: 0;
            top: 0;
            background-color: #f9f9f9;
            display: none;
        }
        .sidebar.active { display: block; }
    </style>
</head>
<body>

    <h2>シフト申請一覧</h2>

    <div class="container">
        <div class="main-content">
            <!-- イベント選択プルダウン -->
            <form id="eventForm" th:action="@{/admin/shift-request-list}" method="get">
                <label for="eventSelect">対象イベント：</label>
                <select id="eventSelect" name="eventId" onchange="document.getElementById('eventForm').submit();">
                    <option th:each="event : ${events}"
                            th:value="${event.eventId}"
                            th:text="${event.displayName}"
                            th:selected="${event.eventId == selectedEventId}">
                    </option>
                </select>
            </form>

            <br>

            <!-- 申請一覧テーブル -->
            <table border="1" style="border-collapse: collapse; width: 100%;">
                <thead>
                    <tr>
                        <th>ユーザーID</th>
                        <th>ユーザー名</th>
                        <th>提出日時</th>
                        <th>状態</th>
                        <th>詳細</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${userSummaries}">
                        <td th:text="${user.userId}">U001</td>
                        <td th:text="${user.userName}">山田太郎</td>
                        <td th:text="${user.formattedSubmittedAt}">2026/07/20 10:00</td>
                        <td th:text="${user.status}">提出</td>
                        <td>
                            <button type="button"
                                    th:disabled="${!user.submitted}"
                                    th:data-userid="${user.userId}"
                                    th:data-username="${user.userName}"
                                    onclick="openSidebar(this)">
                                詳細
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(userSummaries)}">
                        <td colspan="5" style="text-align: center;">対象データがありません。</td>
                    </tr>
                </tbody>
            </table>

            <br>
            <a th:href="@{/admin/shift-management}">戻る</a>
        </div>

        <!-- サイドバーエリア -->
        <div id="sidebar" class="sidebar">
            <button type="button" onclick="closeSidebar()" style="float: right;">×</button>
            <h3>シフト申請詳細</h3>
            <p><strong>ユーザー名：</strong><span id="sidebarUserName">-</span></p>

            <table border="1" style="border-collapse: collapse; width: 100%;">
                <thead>
                    <tr>
                        <th>日付</th>
                        <th>可否</th>
                        <th>開始時刻</th>
                        <th>終了時刻</th>
                    </tr>
                </thead>
                <tbody id="sidebarDetailBody">
                    <!-- JavaScriptで動的生成 -->
                </tbody>
            </table>
        </div>
    </div>

    <script th:src="@{/js/shift-request-list.js}"></script>
</body>
</html>
