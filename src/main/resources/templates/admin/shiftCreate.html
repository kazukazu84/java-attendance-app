<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
    <meta charset="UTF-8">
    <title>シフト作成画面</title>

    <!-- CSS & JS 読み込み -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/shiftCreate.js}" defer></script>
</head>

<body>

    <div class="app-container">

        <!-- 画面ヘッダー -->
        <header class="app-header">

            <h1>📅 シフト作成</h1>

            <!-- 上部操作エリア -->
            <div class="top-container">

                <div class="back-btn-container">
                    <a th:href="@{/admin/shiftCreate/back}"
                       class="btn-secondary"
                       th:classappend="${showModal == true} ? 'disabled' : ''">
                        ← 戻る
                    </a>
                </div>

                <div class="event-select-container">

                    <form th:action="@{/admin/shiftCreate/changeEvent}"
                          th:object="${searchForm}"
                          method="post"
                          class="event-form">

                        <label for="eventSelect">イベント選択：</label>

                        <!-- プルダウンと赤文字メッセージをまとめる枠 -->
                        <div class="select-container">

                            <select id="eventSelect"
                                    th:field="*{selectedEventId}"
                                    th:disabled="${showModal == true or #lists.isEmpty(eventList)}">

                                <option th:each="event : ${eventList}"
                                        th:value="${event.eventId}"
                                        th:text="${event.displayName}">
                                    2026/07/20～2026/08/02
                                </option>

                            </select>

                            <!-- イベントが存在しない場合の赤文字表示 -->
                            <div th:if="${#lists.isEmpty(eventList)}" class="no-event-message">
                                該当するデータまたはテーブルがありません
                            </div>

                        </div>

                        <button type="submit"
                                class="btn-primary"
                                th:disabled="${showModal == true or #lists.isEmpty(eventList)}">
                            変更
                        </button>

                    </form>

                </div>

            </div>
        </header>


        <!-- イベントタイトル表示 -->
        <div class="section-title">

            <h2>
                シフト一覧
                <span th:if="${currentEvent != null}"
                      th:text="'（' + ${currentEvent.displayName} + '）'">
                </span>
            </h2>

        </div>


        <!-- スプレッドシート風シフト一覧テーブル -->
        <main class="calendar-container">

            <!-- ====================================================== -->
            <!-- シフトデータが存在しない場合 -->
            <!-- ====================================================== -->

            <div th:if="${shiftList == null or shiftList.isEmpty()}"
                 class="no-data">

                該当するデータがありません。

            </div>


            <!-- ====================================================== -->
            <!-- シフトデータが存在する場合 -->
            <!-- ====================================================== -->

            <div th:if="${shiftList != null and !shiftList.isEmpty()}"
                 class="table-outer-container">
                 
                <!-- 上部横スクロールバー専用コンテナ -->
                <div id="topScrollbarWrapper"
                     class="top-scrollbar-wrapper">

                    <div id="topScrollbarContent"
                         class="top-scrollbar-content">
                    </div>

                </div>


                <!-- スクロール可能なテーブルエリア -->
                <div id="tableWrapper"
                     class="table-wrapper">

                    <table id="shiftTable"
                           class="shift-table">

                        <thead>

                            <tr>

                                <!-- 左上の固定ヘッダー -->
                                <th class="sticky-header sticky-col">
                                    日付
                                </th>

                                <!-- 横軸：ユーザーID + ユーザー名 -->
                                <th th:each="user : ${userList}"
                                    class="sticky-header"
                                    th:classappend="${userSubmissionMap != null and userSubmissionMap[user.userId] == false
                                                    ? ' unsubmitted-user-header'
                                                    : ''}"
                                    th:text="${user.userId + ' ' + user.userName}">
                                    1001 山田太郎
                                </th>
                            </tr>

                        </thead>


                        <tbody>

                            <!-- ========================================= -->
                            <!-- 日付ごとのシフト行 -->
                            <!-- ========================================= -->
                            <tr th:each="d : ${dateList}">

                                <!-- 左固定：日付 -->
                                <th class="sticky-col date-cell"
                                    th:text="${#temporals.format(d, 'yyyy/MM/dd')}">
                                    2026/07/20
                                </th>


                                <!-- ユーザーごとのシフトセル -->
                                <td th:each="user : ${userList}">

                                    <!-- 該当する日付・ユーザーのShiftを取得 -->
                                    <th:block
                                        th:with="targetShift=${#lists.isEmpty(shiftList) ? null : shiftList.^[shiftDate != null and shiftDate.equals(#vars.d) and userId == #vars.user.userId]}">

                                        <!-- ===================================== -->
                                        <!-- Shiftあり：編集ボタン -->
                                        <!-- ===================================== -->
                                        <form th:if="${targetShift != null}"
                                              th:action="@{/admin/shiftCreate/edit}"
                                              method="get"
                                              class="cell-form">

                                            <input type="hidden"
                                                   name="shiftId"
                                                   th:value="${targetShift.id}" />

                                            <input type="hidden"
                                                   name="eventId"
                                                   th:value="${searchForm.selectedEventId}" />


                                            <button type="submit"
                                                    class="cell-btn"
                                                    th:classappend="${targetShift.isAvailable == 0
                                                        ? 'is-rest-btn'
                                                        : (targetShift.nightShift
                                                            ? 'is-night-btn'
                                                            : '')}"
                                                    th:disabled="${showModal == true}">

                                                <!-- 出勤 -->
                                                <div th:if="${targetShift.isAvailable == 1}"
                                                     class="time-container">

                                                    <span
                                                        th:text="${targetShift.startTime != null
                                                            ? #temporals.format(targetShift.startTime, 'H:mm')
                                                            : ''}">
                                                        09:00
                                                    </span>

                                                    <span class="time-sep">
                                                        ～
                                                    </span>

                                                    <span
                                                        th:text="${targetShift.endTime != null
                                                            ? #temporals.format(targetShift.endTime, 'H:mm')
                                                            : ''}">
                                                        18:00
                                                    </span>

                                                </div>


                                                <!-- 休み -->
                                                <div th:if="${targetShift.isAvailable == 0}"
                                                     class="rest-container">
                                                    休
                                                </div>

                                            </button>

                                        </form>


                                        <!-- ===================================== -->
                                        <!-- Shiftなし：新規作成ボタン -->
                                        <!-- ===================================== -->
                                        <form th:if="${targetShift == null}"
                                              th:action="@{/admin/shiftCreate/new}"
                                              method="get"
                                              class="cell-form">

                                            <input type="hidden"
                                                   name="eventId"
                                                   th:value="${searchForm.selectedEventId}" />

                                            <input type="hidden"
                                                   name="userId"
                                                   th:value="${user.userId}" />

                                            <input type="hidden"
                                                   name="shiftDate"
                                                   th:value="${#temporals.format(d, 'yyyy-MM-dd')}" />


                                            <button type="submit"
                                                    class="cell-btn is-unsubmitted-btn"
                                                    th:disabled="${showModal == true}">

                                                <div class="unsubmitted-container">
                                                    未
                                                </div>

                                            </button>

                                        </form>

                                    </th:block>

                                </td>

                            </tr>


                            <!-- ========================================= -->
                            <!-- 月間勤務合計 -->
                            <!-- ========================================= -->
                            <tr class="monthly-summary-row">

                                <!-- 左側 -->
                                <th class="sticky-col monthly-summary-label">
                                    合計（月）
                                </th>


                                <!-- ユーザーごとの月間集計 -->
                                <td th:each="user : ${userList}"
                                    class="monthly-summary-cell">

                                    <!-- 月別集計が存在する場合 -->
                                    <div th:if="${monthlySummaryMap != null and monthlySummaryMap[user.userId] != null
                                                 and !monthlySummaryMap[user.userId].isEmpty()}">

                                        <div th:each="summary : ${monthlySummaryMap[user.userId]}"
                                             class="monthly-summary-item">

                                            <!-- 月 -->
                                            <div class="monthly-summary-month"
                                                 th:text="${summary.monthText}">
                                                8月
                                            </div>

                                            <!-- 勤務日数 -->
                                            <div class="monthly-summary-days"
                                                 th:text="${summary.workingDaysText}">
                                                20日
                                            </div>

                                            <!-- 勤務時間 -->
                                            <div class="monthly-summary-time"
                                                 th:text="${summary.totalTimeText}">
                                                160時間30分
                                            </div>

                                        </div>

                                    </div>


                                    <!-- 集計対象がない場合 -->
                                    <div th:if="${monthlySummaryMap == null or monthlySummaryMap[user.userId] == null
                                                 or monthlySummaryMap[user.userId].isEmpty()}"
                                         class="monthly-summary-empty">
                                        -
                                    </div>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>


    <!-- ====================================================== -->
    <!-- シフト編集・新規作成ポップアップ -->
    <!-- ====================================================== -->

    <div id="modalOverlay"
         class="modal-overlay"
         th:if="${showModal == true}">

        <div class="modal-content">

            <div class="modal-header">

                <h3 th:text="${shiftForm.id == null ? 'シフト新規登録' : 'シフト編集'}">
                    シフト編集
                </h3>

            </div>


            <form th:action="@{/admin/shiftCreate/update}"
                  th:object="${shiftForm}"
                  method="post">

                <!-- ID -->
                <input type="hidden"
                       th:field="*{id}" />

                <!-- イベントID -->
                <input type="hidden"
                       th:field="*{eventId}" />


                <!-- ユーザーID -->
                <div class="modal-form-group">

                    <label>
                        ユーザーID：
                    </label>

                    <input type="text"
                           th:field="*{userId}"
                           class="input-readonly"
                           readonly />

                </div>


                <!-- 勤務日 -->
                <div class="modal-form-group">

                    <label>
                        勤務日：
                    </label>

                    <input type="date"
                           th:field="*{shiftDate}"
                           class="input-readonly"
                           readonly />

                    <span class="error-message"
                          th:if="${#fields.hasErrors('shiftDate')}"
                          th:errors="*{shiftDate}">
                    </span>

                </div>


                <!-- 休みチェックボックス -->
                <div class="modal-form-group checkbox-group">

                    <label>

                        <input type="checkbox"
                               id="restCheckbox"
                               th:field="*{rest}" />

                        <span>
                            ☕ 休みとして設定
                        </span>

                    </label>

                </div>


                <!-- ================================================== -->
                <!-- 出勤予定時間 -->
                <!-- ================================================== -->

                <div class="modal-form-group">

                    <label for="startTime">
                        出勤予定時間：
                    </label>

                    <input type="time"
                           id="startTime"
                           th:field="*{startTime}"
                           class="form-control" />

                    <!-- 開始時刻のバリデーションエラー -->
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('startTime')}"
                         th:errors="*{startTime}">
                    </div>

                </div>


                <!-- ================================================== -->
                <!-- 退勤予定時間 -->
                <!-- ================================================== -->

                <div class="modal-form-group">

                    <label for="endTime">
                        退勤予定時間：
                    </label>

                    <input type="time"
                           id="endTime"
                           th:field="*{endTime}"
                           class="form-control" />

                    <!-- 退勤時刻のエラー表示 -->
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('endTime')}"
                         th:errors="*{endTime}">
                    </div>

                </div>


                <!-- 備考・メモ -->
                <div class="modal-form-group">

                    <label>
                        備考・メモ：
                    </label>

                    <input type="text"
                           th:field="*{memo}"
                           placeholder="例：早番、受付担当など" />

                    <span class="error-message"
                          th:if="${#fields.hasErrors('memo')}"
                          th:errors="*{memo}">
                    </span>

                </div>


                <!-- モーダルボタン -->
                <div class="modal-buttons">

                    <button type="submit"
                            class="btn-primary">
                        保存する
                    </button>

                    <button type="button"
                            id="btnCancel"
                            class="btn-cancel"
                            onclick="cancelModal()">
                        キャンセル
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
