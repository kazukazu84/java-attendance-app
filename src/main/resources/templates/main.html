<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>メイン画面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <!-- CSRFトークン -->
    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<div class="container">
    <div class="main-container">
        <div class="row g-3">
            
            <!-- ⬅️ 左カラム：ヘッダー情報・打刻・ログエリア -->
            <div class="col-md-4">
                
				<!-- ①②③ 簡易ボタン & ログアウト & SNS -->
				<div class="panel-box mb-3">
				    <div class="row g-2">

				        <!-- 簡易 -->
				        <div class="col-4">
				            <a th:href="@{/user/attendance}" class="btn btn-nav py-1" style="font-size: 0.9rem;">
				                簡易
				            </a>
				        </div>

				        <!-- ログアウト -->
				        <div class="col-4">
				            <form th:action="@{/logout}" method="post" class="w-100">
				                <button type="submit" class="btn btn-nav py-1" style="font-size: 0.9rem;">
				                    ログアウト
				                </button>
				            </form>
				        </div>

				        <!-- SNSへ -->
				        <div class="col-4">
				            <a th:href="@{/user/timeline}" class="btn btn-nav py-1" style="font-size: 0.9rem;">
				                SNSへ
				            </a>
				        </div>
						
						<!-- 運行状況 -->
				        <div class="col-4">
				            <a th:href="@{/user/rail/status}" class="btn btn-nav py-1" style="font-size: 0.9rem;">
				               運行状況
				            </a>
				        </div>

				    </div>
				</div>

                <!-- ユーザーID・ユーザー名表示 -->
                <div class="panel-box user-info-box mb-3 text-start">
                    <div>ユーザーID: <span th:text="${user.userId}">0</span></div>
                    <div>名前: <span th:text="${user.userName}">ゲスト</span></div>
                </div>

                <!-- ③ 時刻 & 出退勤ボタンエリア -->
                <div class="panel-box mb-3">
                    <div class="time-display text-center py-2 mb-3" id="realTimeDisplay">
                        yyyy/MM/dd HH:mm:ss
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <button type="button" id="btnClockIn" class="btn btn-clock-in w-100" 
                                    th:disabled="${!status.canClockIn}">出勤</button>
                        </div>
                        <div class="col-6">
                            <button type="button" id="btnClockOut" class="btn btn-clock-out w-100" 
                                    th:disabled="${!status.canClockOut}">退勤</button>
                        </div>
                    </div>
                </div>

                <!-- ログ表示エリア -->
                <div class="log-box" id="logDisplayBox">
                    <div th:each="log : ${logList}" th:text="'・' + ${log.formattedLogMessage}" class="mb-1"></div>
                </div>

            </div>

            <!-- ➡️ 右カラム：ナビゲーションボタン & シフト表示エリア -->
            <div class="col-md-8">
                <div class="right-panel-wrapper">
                    
                    <!-- ④⑤⑥⑩ ナビゲーションボタンエリア -->
                    <div class="mb-3">
                        <!-- 一般ユーザー時の表示 -->
                        <div sec:authorize="!hasRole('ADMIN')" class="row g-2 mb-2">
                            <div class="col-12">
                                <a th:href="@{/user/salary/confirm}" class="btn btn-nav">給与確認</a>
                            </div>
                            <div class="col-12">
                                <a th:href="@{/user/shiftRequestSelect}" class="btn btn-nav">シフト申請</a>
                            </div>
                        </div>

                        <!-- 管理者時の表示 -->
                        <div sec:authorize="hasRole('ADMIN')" class="row g-2 mb-2">
                            <div class="col-6">
                                <a th:href="@{/admin/UserManagement}" class="btn btn-nav">ユーザー管理</a>
                            </div>
                            <div class="col-6">
                                <a th:href="@{/user/salary/confirm}" class="btn btn-nav">給与確認</a>
                            </div>
                            <div class="col-6">
                                <a th:href="@{/user/shiftRequestSelect}" class="btn btn-nav">シフト申請</a>
                            </div>
                            <div class="col-6">
                                <a th:href="@{/admin/shift-management}" class="btn btn-nav">シフト管理</a>
                            </div>
                        </div>
                    </div>

                    <!-- ⑦⑧ シフト表示枠 -->
									<div class="shift-box">
					    <div class="shift-content">

					        <!-- 月間シフト表示エリア -->
							<div id="monthlyShiftArea"
							     th:style="${weeklyMode} ? 'display:none;' : 'display:block;'">

					            <div class="shift-header">

					                <div class="d-flex align-items-center justify-content-center gap-2">

					                    <span class="fw-bold fs-5">
					                        月間シフト
					                    </span>
										
										<form method="get">

										    <input type="hidden"
										           name="mode"
										           value="month">
												   
												   <select name="month"
												           onchange="this.form.submit()">

														   <option th:each="m : ${monthList}"
														           th:value="${m.year + '-' + m.monthValue}"
														           th:text="${m.year + '年' + m.monthValue + '月'}"
														           th:selected="${selectedYearMonth ==
														                         (m.year + '-' + m.monthValue)}">
														   </option>

												   </select>

					                    </form>

					                </div>

					                <div class="toggle-area">

					                    <button id="toWeeklyButton"
					                            type="button"
					                            class="btn btn-sm-custom">

					                        週間シフト表示

					                    </button>

					                </div>

					            </div>

								<table border="1"
								       style="width:100%;
								              text-align:center;
								              border-top:1px solid #cccccc;">
					                <tr>
										<th style="border:1px solid #cccccc;">日</th>
										<th style="border:1px solid #cccccc;">月</th>
										<th style="border:1px solid #cccccc;">火</th>
										<th style="border:1px solid #cccccc;">水</th>
										<th style="border:1px solid #cccccc;">木</th>
										<th style="border:1px solid #cccccc;">金</th>
										<th style="border:1px solid #cccccc;">土</th>
					                </tr>

					                <tr th:each="week : ${calendarWeeks}">

										<td th:each="day : ${week}"
										    style="width:120px;
										           height:80px;
										           vertical-align:top;
										           border:1px solid #cccccc;
										           text-align:center;">

					                        <div style="height:25px;
					                                    border-bottom:1px solid #cccccc;">

					                            <span th:text="${day == 0 ? '' : day}">
					                            </span>

					                        </div>

											<div style="
											    height:55px;
											    display:flex;
											    justify-content:center;
											    align-items:center;
											    flex-direction:column;
											">

												<span th:each="shift : ${monthlyShiftList}"
												      th:if="${shift.shiftDate.dayOfMonth == day}">

												    <span th:if="${shift.startTime != null}">
												        <span th:text="${shift.startTime}"></span>
												        <br>
												        <span th:text="${'～' + shift.endTime}"></span>
												    </span>

												    <span th:if="${shift.startTime == null}">
												        休み
												    </span>

												</span>

					                        </div>

					                    </td>

					                </tr>

					            </table>

					        </div>

					        <!-- 週間シフト表示エリア -->
					        <div id="weeklyShiftArea"
					             th:style="${weeklyMode} ? 'display:block;' : 'display:none;'"
					             class="h-100 flex-column">

					            <div class="shift-header">

					                <div class="d-flex align-items-center justify-content-center gap-2">

					                    <span class="fw-bold fs-5">
					                        週間シフト
					                    </span>

										<form method="get">

										    <input type="hidden"
										           name="mode"
										           value="week">
												
														  
												   <select name="month"
												           onchange="this.form.submit()">

														   <option th:each="m : ${monthList}"
														           th:value="${m.year + '-' + m.monthValue}"
														           th:text="${m.year + '年' + m.monthValue + '月'}"
														           th:selected="${selectedYearMonth ==
														                         (m.year + '-' + m.monthValue)}">
														   </option>
														   `

												   </select>

					                        <select name="week"
					                                onchange="this.form.submit()">

					                            <option value="1"
					                                    th:selected="${week == 1}">
					                                1週目
					                            </option>

					                            <option value="2"
					                                    th:selected="${week == 2}">
					                                2週目
					                            </option>

					                            <option value="3"
					                                    th:selected="${week == 3}">
					                                3週目
					                            </option>

					                            <option value="4"
					                                    th:selected="${week == 4}">
					                                4週目
					                            </option>

					                            <option value="5"
					                                    th:selected="${week == 5}">
					                                5週目
					                            </option>

					                        </select>

					                    </form>

					                </div>

					                <div class="toggle-area">

					                    <button id="toMonthlyButton"
					                            type="button"
					                            class="btn btn-sm-custom">

					                        月間シフト表示

					                    </button>

					                </div>

					            </div>

                  <table style="width:100%; border-collapse:collapse; text-align:center;">

					                <tr>
					                      <th style="border:1px solid #ccc;">日付・曜日</th>
					                    <th style="border:1px solid #ccc;">シフト情報</th>
					                </tr>

					                <tr th:each="shift : ${weeklyShiftList}">

										<td style="border:1px solid #ccc;"
										    th:text="${shift.shiftDate + '(' +
										        (shift.shiftDate.dayOfWeek.name() == 'MONDAY' ? '月' :
										        shift.shiftDate.dayOfWeek.name() == 'TUESDAY' ? '火' :
										        shift.shiftDate.dayOfWeek.name() == 'WEDNESDAY' ? '水' :
										        shift.shiftDate.dayOfWeek.name() == 'THURSDAY' ? '木' :
										        shift.shiftDate.dayOfWeek.name() == 'FRIDAY' ? '金' :
										        shift.shiftDate.dayOfWeek.name() == 'SATURDAY' ? '土' :
										        '日')
										        + ')'}">
										</td>

											<td style="border:1px solid #ccc;"
										    th:text="${shift.startTime == null ?
										            '休み'
										            : shift.startTime + '～' + shift.endTime}">
										</td>

			
					                </tr>

					            </table>

					        </div>

					    </div>
					</div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
    // 1. リアルタイム時計
    function updateClock() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const date = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('realTimeDisplay').innerText = `${year}/${month}/${date} ${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. 打刻処理 (SPA)
    function updateDOM(data) {
        document.getElementById('btnClockIn').disabled = !data.canClockIn;
        document.getElementById('btnClockOut').disabled = !data.canClockOut;
        fetchLatestLogs();
    }

    function fetchLatestLogs() {
        fetch('/user/main')
            .then(response => response.text())
            .then(htmlText => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const newLogBox = doc.getElementById('logDisplayBox');
                if (newLogBox) {
                    document.getElementById('logDisplayBox').innerHTML = newLogBox.innerHTML;
                }
            })
            .catch(error => console.error('Log update error:', error));
    }

    // 出勤ボタン
    document.getElementById('btnClockIn').addEventListener('click', () => {
        const token = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const header = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
        fetch('/api/attendance/clock-in', { 
            method: 'POST',
            headers: { [header]: token }
        })
        .then(response => {
            if (!response.ok) {
                return response.text().then(errorMessage => Promise.reject(errorMessage));
            }
            return response.json();
        })
        .then(data => updateDOM(data))
        .catch(errorText => alert("【打刻エラー】\n" + errorText));
    });

    // 退勤ボタン
    document.getElementById('btnClockOut').addEventListener('click', () => {
        const token = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const header = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
        fetch('/api/attendance/clock-out', { 
            method: 'POST',
            headers: { [header]: token }
        })
        .then(response => {
            if (!response.ok) {
                return response.text().then(errorMessage => Promise.reject(errorMessage));
            }
            return response.json();
        })
        .then(data => updateDOM(data))
        .catch(errorText => alert("【打刻エラー】\n" + errorText));
    });

 	// 3. シフト切り替え
	document.getElementById("toWeeklyButton").addEventListener("click", function() {

	    const monthlyArea =
	            document.getElementById("monthlyShiftArea");

	    const weeklyArea =
	            document.getElementById("weeklyShiftArea");

	    monthlyArea.style.display = "none";

	    weeklyArea.style.display = "block";

	});

	document.getElementById("toMonthlyButton").addEventListener("click", function() {

	    const monthlyArea =
	            document.getElementById("monthlyShiftArea");

	    const weeklyArea =
	            document.getElementById("weeklyShiftArea");

	    weeklyArea.style.display = "none";

	    monthlyArea.style.display = "block";

	});
</script>
</body>
</html>
