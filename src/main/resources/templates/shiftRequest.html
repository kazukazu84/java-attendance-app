<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>シフト申請入力</title>

    <link rel="stylesheet"
          th:href="@{/css/shiftRequest.css}">

    <script th:src="@{/js/shiftRequest.js}"
            defer>
    </script>

</head>

<body>

<div class="container">

    <h2 class="page-title">シフト申請入力</h2>

    <div class="card">

        <!-- 対象期間表示エリア -->
        <div class="period-area">
            <label>対象期間：</label>
            <span th:text="${form.targetPeriod}">2026/09/01 ～ 2026/09/15</span>
        </div>

        <!-- シフト入力フォーム -->
        <form th:action="@{/user/shiftRequest}" th:object="${form}" method="post">

            <!-- イベントID（非表示） -->
            <input type="hidden" th:field="*{eventId}" />

            <table class="shift-table">
                <thead>
                    <tr>
                        <th>日付</th>
                        <th>出勤可否</th>
                        <th>開始希望時間</th>
                        <th>終了希望時間</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="shift, stat : *{shiftList}">
                        <!-- 日付 -->
                        <td>
                            <span th:text="${shift.workDate}">2026-09-01</span>
                            <input type="hidden" th:field="*{shiftList[__${stat.index}__].workDate}" />
                        </td>

						<!-- 出勤可否 (○ / ×) -->
						<td class="availability-cell">

						    <label>
						        <input type="radio"
						               th:field="*{shiftList[__${stat.index}__].available}"
						               value="○">
						        ○
						    </label>

						    <label>
						        <input type="radio"
						               th:field="*{shiftList[__${stat.index}__].available}"
						               value="×">
						        ×
						    </label>

						</td>

                        <!-- 開始希望時間 -->
                        <td>
                            <input type="time" th:field="*{shiftList[__${stat.index}__].startTime}" />
                        </td>

                        <!-- 終了希望時間 -->
                        <td>
                            <input type="time" th:field="*{shiftList[__${stat.index}__].endTime}" />
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- ボタン＆メッセージ表示エリア -->
            <div class="button-area" style="margin-top: 20px; display: flex; align-items: center; gap: 15px;">
                
                <!-- 申請ボタン -->
                <button type="submit" class="submit-btn">申請</button>

                <!-- 【申請成功メッセージ】（申請成功時にボタンの横に表示） -->
                <span th:if="${successMessage}" 
                      th:text="${successMessage}" 
                      style="color: #2e7d32; font-weight: bold; font-size: 1.1em;">
                    申請しました
                </span>

                <!-- 【エラーメッセージ】（バリデーションエラー等で表示） -->
                <span th:if="${errorMessage}" 
                      th:text="${errorMessage}" 
                      style="color: #d32f2f; font-weight: bold; font-size: 1.1em;">
                </span>

            </div>

        </form>

        <!-- 戻るボタンエリア -->
        <div class="back-area" style="margin-top: 25px;">
            <a th:href="@{/user/shiftRequestSelect}">シフト申請選択画面へ戻る</a>
        </div>

    </div> <!-- /.card -->

</div> <!-- /.container -->

</body>
</html>
