<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイムライン - 社内SNS</title>
    <link rel="stylesheet" th:href="@{/css/timeline.css}">
</head>
<body>

<header class="navbar">
    <div class="nav-brand">
        <a th:href="@{${basePath + '/timeline'}}">社内SNS</a>
    </div>
    <nav class="nav-menu">
        <a th:href="@{${basePath + '/timeline'}}" class="nav-item active">タイムライン</a>
        <a th:href="@{${basePath + '/post'}}" class="nav-item">投稿</a>
        <a th:href="@{${basePath + '/dm'}}" class="nav-item">DM</a>
        <a th:href="@{${basePath} + '/main'}" class="nav-item">メイン画面へ</a>
    </nav>
    <div class="user-badge-container">
        <span class="user-id-badge" th:text="${currentUser.username}">user01</span>
        <span class="role-badge"
              th:classappend="${#lists.contains(currentUser.authorities.![authority], 'ROLE_ADMIN')} ? 'admin' : 'user'"
              th:text="${#lists.contains(currentUser.authorities.![authority], 'ROLE_ADMIN')} ? '管理者' : '一般'">
            一般
        </span>
    </div>
</header>

<main class="main-container">

    <!-- 投稿フォーム -->
    <section class="card form-card">
        <h3>いまどうしてる？</h3>
        <form th:action="@{${basePath + '/post'}}" th:object="${postForm}" method="post">
            <div class="form-group">
                <textarea th:field="*{content}" rows="3"
                          placeholder="社内に共有したいことを入力してください..." required></textarea>
            </div>
            <div class="form-actions align-right">
                <button type="submit" class="btn post-btn">投稿する</button>
            </div>
        </form>
    </section>

    <!-- 投稿フィード一覧 -->
    <section class="feed">

        <div th:each="post : ${posts}" class="card post-card">

            <!-- 投稿ヘッダー -->
            <div class="post-header">
                <div class="post-user-info">
                    <span class="post-user-name" th:text="${post.userName}">山田 太郎</span>
                    <span class="post-user-id" th:text="'@' + ${post.userId}">@yamada</span>
                </div>
                <span class="post-time"
                      th:text="${#temporals.format(post.createdAt, 'yyyy/MM/dd HH:mm')}">2026/05/20 10:00</span>
            </div>

            <!-- 投稿本文 -->
            <div class="post-content" th:text="${post.content}">
                投稿本文がここに入ります。
            </div>

            <!-- アクションボタン -->
            <div class="post-actions">

                <!-- いいね -->
                <form th:action="@{${basePath + '/like'}}" method="post" class="action-form">
                    <input type="hidden" name="postId" th:value="${post.postId}"/>
                    <button type="submit" class="btn-icon"
                            th:classappend="${post.likedByCurrentUser} ? 'active-like' : ''">
                        ♥ <span th:text="${post.likeCount}">0</span>
                    </button>
                </form>

                <!-- リツイート -->
                <form th:action="@{${basePath + '/retweet'}}" method="post" class="action-form">
                    <input type="hidden" name="postId" th:value="${post.postId}"/>
                    <button type="submit" class="btn-icon"
                            th:classappend="${post.retweetedByCurrentUser} ? 'active-retweet' : ''">
                        🔄 <span th:text="${post.retweetCount}">0</span>
                    </button>
                </form>

                <!-- 引用RT -->
                <a th:href="@{${basePath + '/quote-retweet'}(postId=${post.postId})}" class="btn-icon-link">
                    💬 引用 <span th:text="${post.quoteCount}">0</span>
                </a>

            </div>

            <!-- ▼ リツイート簡易表示（最新3件） -->
            <div class="quote-preview"
                 th:attr="data-post-id=${post.postId}"
                 th:if="${quotePreviewMap[post.postId].size() > 0}">

                <div th:each="quote : ${quotePreviewMap[post.postId]}" class="quote-preview-item">

                    <div class="quote-user" th:text="${quote.userName}"></div>
                    <div class="quote-comment" th:text="${quote.comment}"></div>
                    <div class="quote-time"
                         th:text="${#temporals.format(quote.createdAt, 'yyyy/MM/dd HH:mm')}"></div>

                    <!-- ▼ コメントする -->
                    <a th:href="@{${basePath + '/quote-retweet'}(postId=${post.postId}, parentQuoteId=${quote.quoteId})}"
                       class="quote-reply-btn">
                        ↩ コメントする
                    </a>

                    <!-- ▼ コメントが付いている場合だけ表示するボタン（完全安全版） -->
                    <div th:if="${childrenMap != null and childrenMap.containsKey(quote.quoteId)}">
                        <a th:href="@{${basePath + '/quote-retweet'}(postId=${post.postId}, parentQuoteId=${quote.quoteId})}"
                           class="quote-reply-btn">
                            👁 ここに付いたコメントを見る
                        </a>
                    </div>

                </div>
            </div>

            <!-- ▼ 「すべての引用を見る」 -->
            <div th:if="${quoteListMap[post.postId].size() > 3}"
                 class="quote-more"
                 th:onclick="'toggleQuoteList(' + ${post.postId} + ')'">
                すべての引用を見る
            </div>

            <!-- ▼ 引用RT一覧 -->
            <div class="quote-list"
                 th:id="'quote-list-' + ${post.postId}"
                 style="display:none;">

                <div th:each="q : ${quoteListMap[post.postId]}" class="quote-list-item">

                    <div class="quote-user" th:text="${q.userName}"></div>
                    <div class="quote-comment" th:text="${q.comment}"></div>

                    <div class="quote-source">
                        <span class="quote-source-label">引用元：</span>
                        <span th:text="${post.content}"></span>
                    </div>

                    <div class="quote-time"
                         th:text="${#temporals.format(q.createdAt, 'yyyy/MM/dd HH:mm')}"></div>

                    <!-- ▼ 引用RTへの返信 -->
                    <a th:href="@{${basePath + '/quote-retweet'}(postId=${post.postId}, parentQuoteId=${q.quoteId})}"
                       class="quote-reply-btn">
                        ↩ コメントする
                    </a>

                    <!-- ▼ 数珠構造（子コメント） -->
                    <div class="quote-thread"
                         th:if="${childrenMap != null and childrenMap.containsKey(q.quoteId)}">

                        <div th:each="child : ${childrenMap[q.quoteId]}" class="quote-thread-child">
                            <div class="quote-user" th:text="${child.userName}"></div>
                            <div class="quote-comment" th:text="${child.comment}"></div>
                            <div class="quote-time"
                                 th:text="${#temporals.format(child.createdAt, 'yyyy/MM/dd HH:mm')}"></div>
                        </div>

                    </div>

                </div>

                <div class="quote-back"
                     th:onclick="'toggleQuoteList(' + ${post.postId} + ')'">
                    元の3件に戻す
                </div>

            </div>

        </div>

        <div th:if="${#lists.isEmpty(posts)}" class="empty-state card">
            <p>表示できる投稿がありません。</p>
        </div>

    </section>
</main>

<script src="/js/quote.js"></script>

</body>
</html>
